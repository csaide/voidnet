[package]
name = "voidnet"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
errno = { version = "0.3" }
thiserror = { version = "2" }
memmap2 = { version = "0.9" }
libc = { version = "0.2" }
libxdp-sys = { git = "https://github.com/belowm/libxdp-sys.git", branch = "main" }
pnet = { version = "0.35" }
dashmap = { version = "6.1" }

[lib]
name = "libvoid"
path = "src/lib.rs"
test = true
bench = true
doctest = true

[[bin]]
name = "voidctl"
path = "src/bin/voidctl.rs"
test = false
bench = false
doctest = false
harness = false
